<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  PPT → PDF 字体替换规则（LibreOffice / soffice 专用）

  背景：业务方提供的 PPT 大多在 Windows + Office 里制作，声明的字体是
  「微软雅黑 / 宋体 / 华文细黑 / 黑体 / 方正兰亭」这类商业字体，Linux 容器里没有。
  没有这份配置时，fontconfig 会把它们判给 DejaVu Sans/Serif —— 这两个字体
  **没有中文字形**，soffice 只能再逐字形回退到 Noto CJK，于是同一行里
  拉丁字符用 DejaVu 的度量、中文字形用 Noto 的度量，字宽与行高全部错位，
  表现为文字重叠、标题换行、表格跑位（见 backend/docs/ppt-video-font-attribution.md）。

  这里只做「字体族改写」，不复制任何商业字体文件：
  思源黑体/宋体对应的字形由 SIL OFL 授权的 Noto CJK 承担，可安全随镜像分发。

  与代码的联动：任何改动都要同步递增 app/modules/agent/render.py 的 FONT_PROFILE，
  否则页图与中间 PDF 缓存不会失效，用户会继续看到旧画面。

  为什么每条规则都写 `qual="first"`：
  fontconfig 在处理 Arial 时会把 45-latin.conf 里的别名链展开成
  「Arial, Arimo, Liberation Sans, ..., Microsoft YaHei, Microsoft JhengHei, ...」，
  微软雅黑就藏在这条**弱回退链**里。若用 `qual="any"`，
  请求 Arial 也会命中「微软雅黑」那条规则，把 Noto Sans CJK SC 提到强绑定位置，
  结果英文文本被换成 Noto（实测 Arial → Noto Sans CJK SC），版式反而更偏。
  `qual="first"` 只比对 pattern 里的首选族名，正好避开别名链。
-->
<fontconfig>

  <!-- ═══ 无衬线中文字体 → Noto Sans CJK SC ═══ -->

  <match target="pattern">
    <test qual="first" name="family"><string>微软雅黑</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>Microsoft YaHei</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>Microsoft YaHei UI</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>Microsoft YaHei Light</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC Light</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>微软雅黑 Light</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC Light</string></edit>
  </match>

  <match target="pattern">
    <test qual="first" name="family"><string>思源黑体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>思源黑体 CN</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>思源黑体 CN Regular</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>思源黑体 CN Bold</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>Source Han Sans SC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>Source Han Sans CN</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>Noto Sans SC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>

  <match target="pattern">
    <test qual="first" name="family"><string>华文细黑</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>STXihei</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>华文黑体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>STHeiti</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>

  <match target="pattern">
    <test qual="first" name="family"><string>黑体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>SimHei</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>Heiti SC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>

  <match target="pattern">
    <test qual="first" name="family"><string>等线</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>DengXian</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>

  <match target="pattern">
    <test qual="first" name="family"><string>苹方</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>PingFang SC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>

  <!--
    小米兰亭 / MiSans：族名带字重后缀（`MiSans Normal`、`MiSans Demibold`），
    逐条枚举会漏，改用 contains 一次覆盖。实测「有限空间作业安全培训」32 处 ea
    声明为 MiSans，未映射时中文逐字形回退。
  -->
  <match target="pattern">
    <test qual="first" name="family" compare="contains"><string>MiSans</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family" compare="contains"><string>小米兰亭</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family" compare="contains"><string>HarmonyOS Sans</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>

  <!-- 方正兰亭系列：业务 PPT 里常见的标题字体 -->
  <match target="pattern">
    <test qual="first" name="family"><string>方正兰亭中黑_GBK</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>方正兰亭细黑_GBK</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>方正兰亭黑_GBK</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>FZLanTingHeiS-UL-GBK</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>

  <!-- ═══ 衬线中文字体 → Noto Serif CJK SC ═══ -->

  <match target="pattern">
    <test qual="first" name="family"><string>宋体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>SimSun</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>NSimSun</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>Songti SC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>STSong</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>华文宋体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>新細明體</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>PMingLiU</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>MingLiU</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>宋体-简</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>

  <!-- 仿宋 / 楷体：字形差异明显（不是黑体也不是宋体），映射到衬线中文最接近 -->
  <match target="pattern">
    <test qual="first" name="family"><string>仿宋</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>FangSong</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>仿宋_GB2312</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>楷体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>KaiTi</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>STKaiti</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>华文楷体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>

  <!--
    注意：这里**故意不做**「凡是 lang=zh 就强制改用 Noto CJK」的兜底。
    试过 `<test name="lang" compare="contains">zh</test>` + append 的写法，
    结果是 Arial / Calibri 这类拉丁字体也被改成 Noto Sans CJK SC
    （soffice 的 pattern 常带 zh-cn），英文版式反而更偏。
    未列出的族名维持现状：落到系统默认拉丁字体 + 逐字形回退，
    新遇到的字体名再按需补一条显式映射即可。
  -->

</fontconfig>
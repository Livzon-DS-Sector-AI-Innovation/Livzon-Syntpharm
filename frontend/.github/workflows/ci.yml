name: Frontend CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Quick jobs (no cross-repo clone) ───────────────────────────────────────

  typecheck:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: bash scripts/ci.sh typecheck

  lint:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: bash scripts/ci.sh lint

  # ── Full-only jobs ─────────────────────────────────────────────────────────

  build:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    env:
      CI: true
      API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: bash scripts/ci.sh build

  openapi:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Fetch backend OpenAPI spec
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          echo "Fetching openapi.json from backend branch: $BRANCH"

          CLONE_ERR=$(mktemp)

          if git clone --depth 1 --branch "$BRANCH" --single-branch \
            https://x-access-token:${{ secrets.BACKEND_REPO_TOKEN }}@github.com/Livzon-DS-Sector-AI-Innovation/dazah-backend.git \
            ../dazah-backend 2>"$CLONE_ERR"; then
            echo "✓ Cloned backend branch: $BRANCH"
          else
            CLONE_OUTPUT=$(cat "$CLONE_ERR")
            rm -f "$CLONE_ERR"

            if echo "$CLONE_OUTPUT" | grep -qiE "Remote branch $BRANCH not found|didn't match any remote|unknown revision"; then
              echo "::warning::Branch '$BRANCH' not found in backend repo, falling back to main for OpenAPI spec."
              echo "Falling back to main branch..."

              if ! git clone --depth 1 --branch main --single-branch \
                https://x-access-token:${{ secrets.BACKEND_REPO_TOKEN }}@github.com/Livzon-DS-Sector-AI-Innovation/dazah-backend.git \
                ../dazah-backend; then
                echo "::error::Failed to clone backend repo (main branch). Check BACKEND_REPO_TOKEN."
                exit 1
              fi
              echo "✓ Downloaded openapi.json from backend (main fallback)"
            else
              echo "::error::Failed to clone backend repo. Error:"
              echo "$CLONE_OUTPUT"
              exit 1
            fi
          fi

          rm -f "$CLONE_ERR"

      - run: bash scripts/ci.sh openapi

  e2e:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start backend
        run: |
          git clone --depth 1 --branch "${{ github.head_ref || github.ref_name }}" --single-branch \
            https://x-access-token:${{ secrets.BACKEND_REPO_TOKEN }}@github.com/Livzon-DS-Sector-AI-Innovation/dazah-backend.git \
            ../dazah-backend 2>/dev/null \
            || git clone --depth 1 --branch main --single-branch \
            https://x-access-token:${{ secrets.BACKEND_REPO_TOKEN }}@github.com/Livzon-DS-Sector-AI-Innovation/dazah-backend.git \
            ../dazah-backend

          cd ../dazah-backend
          pip install uv
          uv sync --dev

          # Start PostgreSQL via docker
          docker compose up -d db redis
          sleep 5

          # Apply migrations
          export DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/dazah
          export FEISHU__PLATFORM__APP_ID=ci_dummy
          export FEISHU__PLATFORM__APP_SECRET=ci_dummy
          export FEISHU__PLATFORM__REDIRECT_URI=http://localhost:3000/callback
          export FRONTEND_URL=http://localhost:3000
          uv run alembic upgrade head

          # Start backend in background
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

          # Wait for backend to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/docs > /dev/null 2>&1; then
              echo "✓ Backend is ready"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done

      - name: Start frontend
        run: |
          nohup pnpm dev > /tmp/frontend.log 2>&1 &
          echo $! > /tmp/frontend.pid

          # Wait for frontend to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "✓ Frontend is ready"
              break
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 2
          done

      - name: Run Playwright tests
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop services
        if: always()
        run: |
          kill $(cat /tmp/frontend.pid) 2>/dev/null || true
          kill $(cat /tmp/backend.pid) 2>/dev/null || true
          cd ../dazah-backend && docker compose down 2>/dev/null || true

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend quick jobs (all pushes) ────────────────────────────────────────

  backend-typecheck:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      FEISHU__PLATFORM__APP_ID: ci_dummy
      FEISHU__PLATFORM__APP_SECRET: ci_dummy
      FEISHU__PLATFORM__REDIRECT_URI: http://localhost:3000/callback
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install uv
      - run: uv sync --dev
      - run: bash scripts/ci.sh typecheck

  backend-lint:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install uv
      - run: uv sync --dev
      - run: bash scripts/ci.sh lint

  backend-openapi:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      FEISHU__PLATFORM__APP_ID: ci_dummy
      FEISHU__PLATFORM__APP_SECRET: ci_dummy
      FEISHU__PLATFORM__REDIRECT_URI: http://localhost:3000/callback
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install uv
      - run: uv sync --dev
      - run: bash scripts/ci.sh openapi

  backend-migration-scope:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install uv
      - run: uv sync --dev
      - run: bash scripts/ci.sh migration-scope

  # ── Frontend quick jobs (all pushes) ───────────────────────────────────────

  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: 'pnpm' }
      - run: bash scripts/ci.sh typecheck

  frontend-lint:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: 'pnpm' }
      - run: bash scripts/ci.sh lint

  # ── Full jobs (main push | PR | manual) ────────────────────────────────────

  backend-test:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dazah_ci
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dazah_ci
      FEISHU__PLATFORM__APP_ID: ci_dummy
      FEISHU__PLATFORM__APP_SECRET: ci_dummy
      FEISHU__PLATFORM__REDIRECT_URI: http://localhost:3000/callback
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install uv
      - run: uv sync --dev
      - run: bash scripts/ci.sh test

  frontend-e2e:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_BASE_URL: http://localhost:8000
      CI: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: 'pnpm' }

      - name: Install frontend deps
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Install Playwright
        run: cd frontend && pnpm exec playwright install --with-deps chromium

      - name: Start backend
        run: |
          cd backend
          pip install uv
          uv sync --dev
          docker compose -f ../docker-compose.yml up -d postgres redis
          sleep 5
          export DATABASE_URL=postgresql+asyncpg://erp_user:change-me-in-production@localhost:5432/erp
          export FEISHU__PLATFORM__APP_ID=ci_dummy
          export FEISHU__PLATFORM__APP_SECRET=ci_dummy
          export FEISHU__PLATFORM__REDIRECT_URI=http://localhost:3000/auth/callback
          export FRONTEND_URL=http://localhost:3000
          uv run alembic upgrade head
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/docs > /dev/null 2>&1 && break
            sleep 2
          done

      - name: Start frontend
        run: |
          cd frontend
          nohup pnpm dev > /tmp/frontend.log 2>&1 &
          echo $! > /tmp/frontend.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 > /dev/null 2>&1 && break
            sleep 2
          done

      - name: Run Playwright
        run: cd frontend && pnpm exec playwright test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: frontend/playwright-report/, retention-days: 7 }

      - name: Stop services
        if: always()
        run: |
          kill $(cat /tmp/frontend.pid) 2>/dev/null || true
          kill $(cat /tmp/backend.pid) 2>/dev/null || true
          docker compose -f docker-compose.yml down 2>/dev/null || true
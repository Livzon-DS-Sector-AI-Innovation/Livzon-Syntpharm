name: CI
on:
  push:
    branches:
    - '**'
  pull_request:
    branches:
    - main
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  # GitHub runner（海外）无法稳定访问清华 PyPI 镜像，uv sync 会连接超时导致失败；
  # uv.toml 的 fallback 只覆盖"包不存在"，不覆盖网络错误，因此 CI 需显式覆盖为官方源。
  # 中国大陆开发者本地 uv sync 仍走 backend/uv.toml 的 tuna 镜像加速，不受影响。
  UV_DEFAULT_INDEX: https://pypi.org/simple
jobs:
  pr-up-to-date:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Check PR includes the latest main
      run: "git fetch origin main\nMAIN_SHA=$(git rev-parse origin/main)\nMERGE_BASE=$(git merge-base ${{ github.event.pull_request.head.sha }} origin/main)\nif [ \"$MERGE_BASE\" != \"$MAIN_SHA\" ]; then\n  echo \"::error::PR branch does not include the latest main.\"\n  echo \"Merge-base is $MERGE_BASE, but main tip is $MAIN_SHA.\"\n  echo \"Please merge (or rebase) origin/main into your branch.\"\n  exit 1\nfi\necho \"PR includes the latest main ($MAIN_SHA).\"\n"
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: pip install uv && uv sync --dev
    - run: bash scripts/ci/ci.sh lint
  backend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      FEISHU__PLATFORM__APP_ID: ci_dummy
      FEISHU__PLATFORM__APP_SECRET: ci_dummy
      FRONTEND_URL: http://localhost:3000
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: pip install uv && uv sync --dev
    - run: bash scripts/ci/ci.sh typecheck
  openapi:
    runs-on: ubuntu-latest
    env:
      FEISHU__PLATFORM__APP_ID: ci_dummy
      FEISHU__PLATFORM__APP_SECRET: ci_dummy
      FRONTEND_URL: http://localhost:3000
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: pip install uv && cd backend && uv sync --dev
    - uses: pnpm/action-setup@v6
      with:
        version: 10.33.0
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
    - run: cd frontend && pnpm install --frozen-lockfile
    - run: bash scripts/ci.sh openapi
  backend-migration-scope:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: pip install uv && uv sync --dev
    - run: bash scripts/ci/ci.sh migration-scope
  backend-permissions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      FEISHU__PLATFORM__APP_ID: ci_dummy
      FEISHU__PLATFORM__APP_SECRET: ci_dummy
      FRONTEND_URL: http://localhost:3000
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: pip install uv && uv sync --dev
    - run: bash scripts/ci/ci.sh permissions
  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v5
    - uses: pnpm/action-setup@v6
      with:
        version: 10.33.0
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
    - run: bash scripts/ci.sh lint
  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v5
    - uses: pnpm/action-setup@v6
      with:
        version: 10.33.0
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
    - run: bash scripts/ci.sh typecheck
  backend-alembic:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dazah_ci
        ports:
        - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dazah_ci
      FEISHU__PLATFORM__APP_ID: ci_dummy
      FEISHU__PLATFORM__APP_SECRET: ci_dummy
      FRONTEND_URL: http://localhost:3000
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: pip install uv && uv sync --dev
    - run: bash scripts/ci/ci.sh alembic
  backend-test:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dazah_ci
        ports:
        - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dazah_ci
      FEISHU__PLATFORM__APP_ID: ci_dummy
      FEISHU__PLATFORM__APP_SECRET: ci_dummy
      FRONTEND_URL: http://localhost:3000
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: pip install uv && uv sync --dev
    - run: bash scripts/ci/ci.sh test
  frontend-build:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Build Docker image
      run: docker build --target runtime -t frontend-production:latest ./frontend
    - name: Save Docker image
      run: docker save frontend-production:latest | gzip > frontend-image.tar.gz
    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v7
      with:
        name: frontend-image
        path: frontend-image.tar.gz
        retention-days: 1
  backend-image:
    # Builds the backend image ONCE per run, in parallel with the other checks,
    # so the `e2e` job does not have to (that build took ~9.8 min per run,
    # ~6.5 min of it `uv sync`).
    # The buildx GHA layer cache makes repeat runs re-use the `uv sync` layer,
    # which only re-executes when pyproject.toml / uv.lock change.
    # Cache scope is separate from the pnpm/uv action caches.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: docker/setup-buildx-action@v3
    - name: Build backend image
      uses: docker/build-push-action@v6
      with:
        context: ./backend
        load: true
        tags: dazah-backend:latest
        cache-from: type=gha,scope=dazah-backend-image
        cache-to: type=gha,mode=max,scope=dazah-backend-image
    - name: Save Docker image
      run: docker save dazah-backend:latest | gzip > backend-image.tar.gz
    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v7
      with:
        name: backend-image
        path: backend-image.tar.gz
        retention-days: 1
  e2e:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Download Docker image artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: '*-image'
        path: .
        merge-multiple: true
    - name: Load Docker images
      run: |
        docker load < frontend-image.tar.gz
        docker load < backend-image.tar.gz
        docker image ls --format '{{.Repository}}:{{.Tag}}\t{{.Size}}' | grep -E '^(frontend-production|dazah-backend):' || true
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - uses: pnpm/action-setup@v6
      with:
        version: 10.33.0
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
    - run: cd frontend && pnpm install --frozen-lockfile
    - run: cd backend && pip install uv && uv sync --dev
    # Browser binaries are the same for every run of a given Playwright
    # version — cache them instead of downloading (~1.5 min) every time.
    # A cache miss just falls back to the plain install below.
    - name: Resolve Playwright version
      id: playwright
      run: |
        version=$(cd frontend && node -p "require('@playwright/test/package.json').version")
        echo "resolved Playwright $version"
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - run: cd frontend && pnpm exec playwright install --with-deps chromium
    - run: bash scripts/ci.sh e2e
      env:
        CI: true
    - name: Upload E2E diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: e2e-diagnostics
        retention-days: 7
        path: 'frontend/playwright-report/

          frontend/test-results/

          e2e-backend.log

          e2e-frontend.log

          '
    needs:
    - frontend-build
    - backend-image

name: Backend CI

on:
  push:
    branches: [main, dev/livzon-syntpharm]
  pull_request:
    branches: [main, dev/livzon-syntpharm]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --dev

      - name: Run lint checks
        run: bash scripts/ci_local.sh lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --dev

      - name: Run type check
        run: bash scripts/ci_local.sh typecheck

  openapi:
    runs-on: ubuntu-latest
    env:
      FEISHU__PLATFORM__APP_ID: ci_dummy_app_id
      FEISHU__PLATFORM__APP_SECRET: ci_dummy_app_secret
      FEISHU__PLATFORM__REDIRECT_URI: http://localhost:3000/callback
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --dev

      - name: Run OpenAPI check
        run: bash scripts/ci_local.sh openapi

  alembic:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dazah_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dazah_ci
      FEISHU__PLATFORM__APP_ID: ci_dummy_app_id
      FEISHU__PLATFORM__APP_SECRET: ci_dummy_app_secret
      FEISHU__PLATFORM__REDIRECT_URI: http://localhost:3000/callback
      FRONTEND_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Alembic check
        run: bash scripts/ci_local.sh alembic

  migration-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --dev

      - name: Run migration scope check
        run: bash scripts/ci_local.sh migration-scope

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dazah_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dazah_ci
      FEISHU__PLATFORM__APP_ID: ci_dummy_app_id
      FEISHU__PLATFORM__APP_SECRET: ci_dummy_app_secret
      FEISHU__PLATFORM__REDIRECT_URI: http://localhost:3000/callback
      FRONTEND_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: bash scripts/ci_local.sh test

# ┌──────────────────────────────────────────────────────────────────────┐
# │ CI Groups (documentation only — not executable)                     │
# │                                                                     │
# │  quick  = backend-lint + backend-typecheck                          │
# │         + backend-migration-scope + frontend-lint                   │
# │         + frontend-typecheck + openapi                              │
# │                                                                     │
# │  full   = quick + backend-alembic + backend-test                    │
# │         + frontend-build + frontend-e2e                             │
# │                                                                     │
# │  To run locally:                                                    │
# │    bash scripts/ci.sh openapi                                       │
# │    bash scripts/ci.sh e2e                                           │
# │    cd backend && bash scripts/ci/ci.sh test                         │
# │    cd frontend && bash scripts/ci.sh lint                           │
# └──────────────────────────────────────────────────────────────────────┘

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install uv && uv sync --dev
      - run: bash scripts/ci/ci.sh lint

  backend-typecheck:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      FEISHU__PLATFORM__APP_ID: ci_dummy
      FEISHU__PLATFORM__APP_SECRET: ci_dummy
      FEISHU__PLATFORM__REDIRECT_URI: http://localhost:3000/callback
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install uv && uv sync --dev
      - run: bash scripts/ci/ci.sh typecheck

  openapi:
    runs-on: ubuntu-latest
    env:
      FEISHU__PLATFORM__APP_ID: ci_dummy
      FEISHU__PLATFORM__APP_SECRET: ci_dummy
      FEISHU__PLATFORM__REDIRECT_URI: http://localhost:3000/callback
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install uv && cd backend && uv sync --dev
      - uses: pnpm/action-setup@v6
        with: { version: "10.33.0" }
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: 'pnpm', cache-dependency-path: 'frontend/pnpm-lock.yaml' }
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: bash scripts/ci.sh openapi

  backend-migration-scope:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install uv && uv sync --dev
      - run: bash scripts/ci/ci.sh migration-scope

  frontend-lint:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with: { version: "10.33.0" }
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: 'pnpm', cache-dependency-path: 'frontend/pnpm-lock.yaml' }
      - run: bash scripts/ci.sh lint

  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with: { version: "10.33.0" }
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: 'pnpm', cache-dependency-path: 'frontend/pnpm-lock.yaml' }
      - run: bash scripts/ci.sh typecheck

  backend-alembic:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dazah_ci
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dazah_ci
      FEISHU__PLATFORM__APP_ID: ci_dummy
      FEISHU__PLATFORM__APP_SECRET: ci_dummy
      FEISHU__PLATFORM__REDIRECT_URI: http://localhost:3000/callback
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install uv && uv sync --dev
      - run: bash scripts/ci/ci.sh alembic

  backend-test:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dazah_ci
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dazah_ci
      FEISHU__PLATFORM__APP_ID: ci_dummy
      FEISHU__PLATFORM__APP_SECRET: ci_dummy
      FEISHU__PLATFORM__REDIRECT_URI: http://localhost:3000/callback
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install uv && uv sync --dev
      - run: bash scripts/ci/ci.sh test

  frontend-build:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with: { version: "10.33.0" }
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: 'pnpm', cache-dependency-path: 'frontend/pnpm-lock.yaml' }
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci.sh build
        env:
          API_BASE_URL: http://localhost:8000

  frontend-e2e:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - uses: pnpm/action-setup@v6
        with: { version: "10.33.0" }
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: 'pnpm', cache-dependency-path: 'frontend/pnpm-lock.yaml' }
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: cd backend && pip install uv && uv sync --dev
      - run: cd frontend && pnpm exec playwright install --with-deps chromium
      - run: bash scripts/ci.sh e2e
        env:
          CI: true
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          retention-days: 7
          path: |
            frontend/playwright-report/
            frontend/test-results/
            e2e-backend.log
            e2e-frontend.log

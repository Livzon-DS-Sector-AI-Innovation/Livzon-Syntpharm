name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Backend setup
        uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install uv
      - run: uv sync --dev
        working-directory: backend

      - name: Backend lint
        run: bash scripts/ci.sh lint
        working-directory: backend

      - name: Backend typecheck
        run: bash scripts/ci.sh typecheck
        working-directory: backend
        env:
          FEISHU__PLATFORM__APP_ID: ci_dummy
          FEISHU__PLATFORM__APP_SECRET: ci_dummy
          FEISHU__PLATFORM__REDIRECT_URI: http://localhost:3000/callback
          FRONTEND_URL: http://localhost:3000

      - name: Backend openapi
        run: bash scripts/ci.sh openapi
        working-directory: backend
        env:
          FEISHU__PLATFORM__APP_ID: ci_dummy
          FEISHU__PLATFORM__APP_SECRET: ci_dummy
          FEISHU__PLATFORM__REDIRECT_URI: http://localhost:3000/callback
          FRONTEND_URL: http://localhost:3000

      - name: Backend migration-scope
        run: bash scripts/ci.sh migration-scope
        working-directory: backend

      - name: Frontend setup
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: 'pnpm' }

      - name: Frontend lint
        run: bash scripts/ci.sh lint
        working-directory: frontend

      - name: Frontend typecheck
        run: bash scripts/ci.sh typecheck
        working-directory: frontend

  full:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dazah_ci
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Backend alembic check
        uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install uv
      - run: uv sync --dev
        working-directory: backend
      - run: bash scripts/ci.sh alembic
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dazah_ci
          FEISHU__PLATFORM__APP_ID: ci_dummy
          FEISHU__PLATFORM__APP_SECRET: ci_dummy
          FEISHU__PLATFORM__REDIRECT_URI: http://localhost:3000/callback
          FRONTEND_URL: http://localhost:3000

      - name: Backend tests
        run: bash scripts/ci.sh test
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dazah_ci
          FEISHU__PLATFORM__APP_ID: ci_dummy
          FEISHU__PLATFORM__APP_SECRET: ci_dummy
          FEISHU__PLATFORM__REDIRECT_URI: http://localhost:3000/callback
          FRONTEND_URL: http://localhost:3000

      - name: Frontend setup
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Frontend openapi drift check
        run: bash scripts/ci.sh openapi
        working-directory: frontend
        env:
          BACKEND_REPO_PATH: ../backend

      - name: Frontend build
        run: bash scripts/ci.sh build
        working-directory: frontend
        env:
          API_BASE_URL: http://localhost:8000

      - name: Frontend E2E
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - name: Start backend
        run: |
          cd backend
          export DATABASE_URL=postgresql+asyncpg://erp_user:change-me-in-production@localhost:5432/erp
          export FEISHU__PLATFORM__APP_ID=ci_dummy
          export FEISHU__PLATFORM__APP_SECRET=ci_dummy
          export FEISHU__PLATFORM__REDIRECT_URI=http://localhost:3000/auth/callback
          export FRONTEND_URL=http://localhost:3000
          uv run alembic upgrade head
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/docs > /dev/null 2>&1 && break
            sleep 2
          done
      - name: Start frontend
        run: |
          cd frontend
          nohup pnpm dev > /tmp/frontend.log 2>&1 &
          echo $! > /tmp/frontend.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 > /dev/null 2>&1 && break
            sleep 2
          done
      - run: pnpm exec playwright test
        working-directory: frontend
        env:
          API_BASE_URL: http://localhost:8000
          CI: true
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: frontend/playwright-report/, retention-days: 7 }
      - name: Stop services
        if: always()
        run: |
          kill $(cat /tmp/frontend.pid) 2>/dev/null || true
          kill $(cat /tmp/backend.pid) 2>/dev/null || true

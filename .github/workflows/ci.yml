name: Backend CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'

jobs:
  quick:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      FEISHU__PLATFORM__APP_ID: ci_dummy_app_id
      FEISHU__PLATFORM__APP_SECRET: ci_dummy_app_secret
      FEISHU__PLATFORM__REDIRECT_URI: http://localhost:3000/callback
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5.0.1

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --dev

      - name: Run quick CI
        run: bash scripts/ci.sh quick

  full:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dazah_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dazah_ci
      FEISHU__PLATFORM__APP_ID: ci_dummy_app_id
      FEISHU__PLATFORM__APP_SECRET: ci_dummy_app_secret
      FEISHU__PLATFORM__REDIRECT_URI: http://localhost:3000/callback
      FRONTEND_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v5.0.1

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --dev

      - name: Run full CI
        run: bash scripts/ci.sh full

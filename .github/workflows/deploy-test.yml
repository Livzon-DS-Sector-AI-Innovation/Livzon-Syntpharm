name: Deploy Test
on:
  push:
    branches: [test]

concurrency:
  group: deploy-test
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Deploy to Test Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.TEST_SERVER_SSH_KEY }}
          script: |
            cd /opt/Livzon-Syntpharm
            git fetch origin test
            git checkout test
            git reset --hard origin/test

            # 确保基础设施运行
            docker compose -f docker-compose.infra.yml up -d

            # 重建应用服务
            docker compose -f docker-compose.infra.yml -f docker-compose.test.yml build --pull
            docker compose -f docker-compose.infra.yml -f docker-compose.test.yml up -d --force-recreate

            # 等待健康检查
            echo "等待服务启动..."
            sleep 15
            curl -sf http://localhost:18000/health/live || exit 1

            # 清理旧镜像
            docker image prune -f

      - name: Notify Feishu
        if: success()
        run: |
          curl -s -X POST "${{ secrets.FEISHU_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"msg_type\": \"interactive\",
              \"card\": {
                \"header\": {
                  \"title\": { \"tag\": \"plain_text\", \"content\": \"✅ 测试环境已部署\" },
                  \"template\": \"green\"
                },
                \"elements\": [
                  { \"tag\": \"div\", \"text\": { \"tag\": \"lark_md\", \"content\": \"**分支:** test\\n**提交:** ${{ github.sha }}\\n**操作人:** ${{ github.actor }}\\n**时间:** $(date '+%Y-%m-%d %H:%M:%S')\" } },
                  { \"tag\": \"action\", \"actions\": [{ \"tag\": \"button\", \"text\": { \"tag\": \"plain_text\", \"content\": \"访问测试环境\" }, \"url\": \"http://8.138.204.232\", \"type\": \"primary\" }] }
                ]
              }
            }" || true

      - name: Notify Feishu (Failure)
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.FEISHU_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"msg_type\": \"text\",
              \"content\": { \"text\": \"❌ 测试环境部署失败\\n提交: ${{ github.sha }}\\n操作人: ${{ github.actor }}\\n详情: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\" }
            }" || true

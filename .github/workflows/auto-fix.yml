name: Auto Fix Lint & Format

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main, dev, lzhc-zhuang]

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --dev

      - name: Run Ruff Fix (Python)
        run: uv run ruff check . --fix && uv run ruff format .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Deps
        run: cd frontend && npm install

      - name: Run ESLint/Prettier Fix (Frontend)
        run: cd frontend && npx eslint . --fix && npx prettier . --write

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        if: always()
        with:
          commit-message: "chore: auto-fix lint and format errors"
          title: "🤖 Auto-fix: Code style improvements"
          body: "Automated linting and formatting fixes applied by GitHub Actions."
          branch: "auto-fix/${{ github.head_ref || github.ref_name }}"
          delete-branch: true

# 测试服务器 - 应用层
# 运行: docker compose -f docker-compose.infra.yml -f docker-compose.test.yml up -d
# 用途: 部署 test 分支的前后端应用

services:
  migrate:
    build:
      context: ./backend
    container_name: test-migrate
    env_file:
      - .env.test
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_test_pwd}@test-redis:6379/0
      MINIO_ENDPOINT: test-minio:9000
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    restart: "no"
    networks:
      - test-net

  backend:
    build:
      context: ./backend
    container_name: test-backend
    restart: unless-stopped
    env_file:
      - .env.test
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_test_pwd}@test-redis:6379/0
      MINIO_ENDPOINT: test-minio:9000
      EDBO_SERVICE_URL: http://edbo-service:8000
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
    ports:
      - "18000:8000"
    networks:
      - test-net

  edbo-service:
    build:
      context: ./backend
      dockerfile: edbo_service/Dockerfile
    container_name: test-edbo-service
    restart: unless-stopped
    ports:
      - "18001:8000"
    networks:
      - test-net

  frontend:
    build:
      context: ./frontend
      target: runtime
    container_name: test-frontend
    restart: unless-stopped
    environment:
      API_BASE_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "13000:3000"
    networks:
      - test-net

  nginx:
    image: nginx:stable-alpine
    container_name: test-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/test.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - test-net

networks:
  test-net:
    driver: bridge

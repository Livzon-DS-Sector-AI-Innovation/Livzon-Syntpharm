[project]
name = "dazah-backend"
version = "0.1.0"
description = "原料药事业部工厂系统"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
    "python-docx>=1.2.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2",
    "pg8000>=1.31.5",
    "lark-oapi>=1.6.8",
    "pyjwt[crypto]>=2.10.0",
    "tqdm>=4.68.1",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "python-multipart>=0.0.6",
    "playwright>=1.40.0",
    "openai>=2.41.0",
    "apscheduler>=3.10.0",
    "scikit-learn>=1.4",
    "scipy>=1.10.0",
    "ordered-set==4.0.2",
    "croniter>=6.2.2",
    "fastmcp>=3.4.2",
    "paddlepaddle==3.2.0",
    "paddleocr[doc-parser]>=3.7.0",
    "pillow>=10.0.0",
    "pdf2image>=1.16.0",
    "pdfplumber>=0.11.0",
    "pypdf>=3.0.0",
    "minio>=7.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "playwright>=1.40.0",
    "apscheduler>=3.10.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    "edbo_service",
    "edboplus-main",
    "alembic",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/modules/safety/ai_rectification_review/prompts.py" = ["E501"]
"app/modules/safety/ai_hazard_identification/prompts.py" = ["E501"]
"app/modules/safety/ai_hazard_identification/script2_hazard_id/prompts.py" = ["E501"]
"app/modules/safety/ai_prompts.py" = ["E501"]
"app/modules/safety/models.py" = ["E501"]
"app/modules/safety/ai_hazard_identification/tests/test_plugin.py" = ["E501"]
"app/modules/safety/ai_rectification_review/tests/test_plugin.py" = ["E501"]
"app/modules/safety/ai_hazard_identification/script6_recommendations/prompts.py" = ["E501"]
"app/modules/quality/sop_ai/service.py" = ["E501"]
"app/modules/registration/regulatory_tracker/services/ai_analysis_service.py" = ["E501"]
"app/modules/research/api.py" = ["E501"]
"app/modules/research/ich_service.py" = ["E501"]
"app/modules/quality/qms/material_report_service.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = [
    "app/modules/safety/ai_rectification_review/tests/",
    "app/modules/safety/ai_hazard_identification/tests/",
]

[[tool.mypy.overrides]]
module = [
    "lark_oapi.*",
    "fastmcp.*",
    "openpyxl.*",
    "paddlepaddle.*",
    "paddleocr.*",
    "pdf2image.*",
    "ordered_set.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "app.modules.*.repository",
    "app.modules.*.repository.*",
]
disable_error_code = ["arg-type"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.8.0",
]

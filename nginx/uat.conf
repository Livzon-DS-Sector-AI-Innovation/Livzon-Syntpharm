# UAT 环境 nginx 反向代理
# 挂载位置: /etc/nginx/conf.d/default.conf（见 docker-compose.uat.yml 的 nginx 服务）
# 基线来自主干 nginx/default.conf，仅调整 server_name 并移除仅开发态需要的 HMR 转发

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # 当前 UAT 复用原测试服务器公网 IP；如后续分配域名，改成 server_name uat.example.com;
    server_name 8.138.204.232;
    client_max_body_size 50m;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # Next.js static chunks — long-lived cache (content-hashed filenames)
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        set $frontend_upstream frontend:3000;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend — HTML pages get no-cache to avoid stale chunks
    location / {
        set $frontend_upstream frontend:3000;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;

        proxy_read_timeout 600s;
        proxy_connect_timeout 30s;

        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Backend API
    location /api/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;

        proxy_read_timeout 600s;
        proxy_connect_timeout 30s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP AI Agent endpoint
    location /mcp {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;

        proxy_read_timeout 600s;
        proxy_connect_timeout 30s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI docs
    location /docs {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
    }

    location /openapi.json {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
    }
}

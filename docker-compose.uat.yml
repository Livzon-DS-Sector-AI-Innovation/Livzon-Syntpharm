# UAT 服务器 - 应用层
# 运行: docker compose --env-file .env.uat -f docker-compose.uat-infra.yml -f docker-compose.uat.yml up -d
# 用途: 部署 uat 分支的前后端应用
#
# 说明: 基础设施层见 docker-compose.uat-infra.yml。两者必须一起传入，
# 以便 backend 的 depends_on 健康检查条件能够解析到 postgres/redis/minio。

services:
  migrate:
    build:
      context: ./backend
    container_name: uat-migrate
    env_file:
      - .env.uat
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_uat_pwd}@uat-redis:6379/0
      MINIO_ENDPOINT: uat-minio:9000
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    restart: "no"
    networks:
      - uat-net

  backend:
    build:
      context: ./backend
    container_name: uat-backend
    restart: unless-stopped
    env_file:
      - .env.uat
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_uat_pwd}@uat-redis:6379/0
      MINIO_ENDPOINT: uat-minio:9000
      EDBO_SERVICE_URL: http://edbo-service:8000
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
    ports:
      - "8000:8000"
    networks:
      - uat-net

  edbo-service:
    build:
      context: ./backend
      dockerfile: edbo_service/Dockerfile
    container_name: uat-edbo-service
    restart: unless-stopped
    ports:
      - "8001:8000"
    networks:
      - uat-net

  frontend:
    build:
      context: ./frontend
      target: runtime
    container_name: uat-frontend
    restart: unless-stopped
    environment:
      API_BASE_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - uat-net

  nginx:
    image: nginx:stable-alpine
    container_name: uat-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/uat.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - uat-net

networks:
  uat-net:
    driver: bridge

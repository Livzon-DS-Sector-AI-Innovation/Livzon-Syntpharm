services:
  postgres:
    image: postgres:17
    container_name: erp-postgres
    restart: unless-stopped
    env_file:
    - .env
    volumes:
    - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:8-alpine
    container_name: erp-redis
    restart: unless-stopped
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - ./redis-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 5s
      retries: 5
  minio:
    # 固定版本：latest 指向的旧镜像读不了 xl-single 格式数据目录，会导致启动崩溃循环
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: erp-minio
    restart: unless-stopped
    environment:
    - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
    - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
    - ./minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test:
      - CMD
      - mc
      - ready
      - local
      interval: 5s
      timeout: 5s
      retries: 5
  migrate:
    build: ./backend
    container_name: erp-migrate
    env_file:
    - .env
    environment:
    - REDIS_URL=redis://erp-redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    command:
    - /app/.venv/bin/alembic
    - upgrade
    - head
    restart: 'no'
  backend:
    build: ./backend
    container_name: erp-backend
    restart: unless-stopped
    env_file:
    - .env
    environment:
    - REDIS_URL=redis://erp-redis:6379/0
    volumes:
    - ./uploads:/app/uploads
    - ./storage:/app/storage
    - ./backend/scripts:/app/scripts
  edbo-service:
    build:
      context: ./backend
      dockerfile: edbo_service/Dockerfile
    container_name: erp-edbo-service
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      target: runtime
    container_name: erp-frontend
    restart: unless-stopped
    environment:
    - API_BASE_URL=http://backend:8000
    depends_on:
    - backend
  nginx:
    image: nginx:stable-alpine
    container_name: erp-nginx
    restart: unless-stopped
    depends_on:
    - frontend
    - backend
    ports:
    - 80:80
    volumes:
    - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

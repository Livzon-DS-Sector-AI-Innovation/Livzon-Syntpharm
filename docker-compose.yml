x-logging: &default-logging
  driver: json-file
  options:
    max-size: 50m
    max-file: "3"

services:
  postgres:
    logging: *default-logging
    image: postgres:17
    container_name: erp-postgres
    restart: unless-stopped
    env_file:
    - .env
    volumes:
    - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    logging: *default-logging
    image: redis:8-alpine
    container_name: erp-redis
    restart: unless-stopped
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - ./redis-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 5s
      retries: 5
  minio:
    logging: *default-logging
    image: minio/minio:latest
    container_name: erp-minio
    restart: unless-stopped
    environment:
    - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
    - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
    - ./minio-data:/data
    ports:
    - 9000:9000
    - 9001:9001
    command: server /data --console-address ":9001"
    healthcheck:
      test:
      - CMD
      - mc
      - ready
      - local
      interval: 5s
      timeout: 5s
      retries: 5
  migrate:
    logging: *default-logging
    build: ./backend
    container_name: erp-migrate
    env_file:
    - .env
    environment:
    - REDIS_URL=redis://erp-redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    command:
    - /app/.venv/bin/alembic
    - upgrade
    - head
    restart: 'no'
  backend:
    logging: *default-logging
    build: ./backend
    container_name: erp-backend
    restart: unless-stopped
    env_file:
    - .env
    environment:
    - REDIS_URL=redis://erp-redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
    - ./uploads:/app/uploads
    - ./storage:/app/storage
    - ./backend/scripts:/app/scripts
    ports:
    - 8000:8000
  # 智能体 - PPT 配音视频渲染 worker（soffice + ffmpeg + 本地 TTS，CPU 重活与 API 隔离）
  ppt-video-worker:
    logging: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
      args:
        # 权重烤进镜像（/opt/tts-models/hub）：运行期再下载会被 20KB/s 出口拖到心跳超时
        PRELOAD_TTS_MODELS: "true"
        PRELOAD_TTS_SOURCE: "modelscope"
    container_name: erp-ppt-video-worker
    restart: unless-stopped
    env_file:
    - .env
    environment:
    - REDIS_URL=redis://erp-redis:6379/0
    - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
    # 权重已在镜像内：禁止再去联网（缺权重时快速失败，而不是静默慢拉）
    - HF_HUB_OFFLINE=1
    # 启动预检硬失败：容器不健康好过「看着在跑、永远出不了片」
    - AGENT_TTS_ASSETS_REQUIRED=true
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
    - ./uploads:/app/uploads
    - ./storage:/app/storage
  edbo-service:
    logging: *default-logging
    build:
      context: ./backend
      dockerfile: edbo_service/Dockerfile
    container_name: erp-edbo-service
    restart: unless-stopped
    ports:
    - 8001:8000
  frontend:
    logging: *default-logging
    build:
      context: ./frontend
      target: runtime
    container_name: erp-frontend
    restart: unless-stopped
    environment:
    - API_BASE_URL=http://backend:8000
    # 注册管理「申报资料撰写」外部系统地址；留空则回退系统内原页面
    - DOSSIER_WRITER_URL=${DOSSIER_WRITER_URL:-}
    depends_on:
    - backend
    ports:
    - 3000:3000
  nginx:
    logging: *default-logging
    image: nginx:stable-alpine
    container_name: erp-nginx
    restart: unless-stopped
    depends_on:
    - frontend
    - backend
    ports:
    - 80:80
    volumes:
    - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

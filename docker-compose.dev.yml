services:
  backend:
    volumes:
    - ./backend/app:/app/app:ro
    # DATABASE_URL 的 host 是容器网络服务名，宿主机连不到 Postgres，DB 测试只能在容器内跑
    - ./backend/tests:/app/tests:ro
    environment:
    - UVICORN_RELOAD=true
    command: "bash -c \"\n  cd /app &&\n  uv run uvicorn app.main:app --reload --host\
      \ 0.0.0.0 --port 8000\n\"\n"
  frontend:
    volumes:
    - ./frontend:/app
    - /app/node_modules
    # 与 uat overlay 保持一致：直连 3000 调试（ALLOWED_DEV_ORIGINS 里登记了公网/内网地址）
    ports:
    - "3000:3000"
    environment:
    - NEXT_TELEMETRY_DISABLED=1
    # dev 模式的跨站资源保护白名单：取 shell 环境变量或仓库根目录 .env（Compose 不读 .env.local）；缺省仅 localhost
    - ALLOWED_DEV_ORIGINS=${ALLOWED_DEV_ORIGINS:-localhost,127.0.0.1}
    # next dev 长时间运行会累积增长（实测 17h 后 RSS 15G / .next/dev 26G）；
    # 6G 上限作为兜底，超限时进程 OOM 退出并由 restart:unless-stopped 自动拉起，
    # 避免整机 29G 内存被单个 dev server 吃满。日常释放靠每日定时重启。
    - NODE_OPTIONS=--max-old-space-size=6144
    command: ["pnpm", "dev"]
    build:
      context: ./frontend
      target: dev

version: '3.8'
services:
  backend:
    volumes:
    - ./backend:/app/backend:ro
    environment:
    - UVICORN_RELOAD=true
    command: "bash -c \"\n  cd /app &&\n  uv run uvicorn app.main:app --reload --host\
      \ 0.0.0.0 --port 8000\n\"\n"
  frontend:
    volumes:
    - ./frontend:/app:ro
    - /app/node_modules
    - frontend_dev_next:/app/.next
    environment:
    - WATCHPACK_POLLING=true
    - CHOKIDAR_USEPOLLING=true
    - NEXT_TELEMETRY_DISABLED=1
    command: "bash -c \"\n  cd /app &&\n  pnpm dev\n\"\n"
    build:
      context: ./frontend
      target: dev
volumes:
  frontend_dev_next: null

services:
  backend:
    volumes:
    - ./backend/app:/app/app:ro
    - ./backend/alembic:/app/alembic:ro
    # DATABASE_URL 的 host 是容器网络服务名，宿主机连不到 Postgres，DB 测试只能在容器内跑
    - ./backend/tests:/app/tests:ro
    environment:
    - UVICORN_RELOAD=true
    command: "bash -c \"\n  cd /app &&\n  uv run uvicorn app.main:app --reload --host\
      \ 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'\n\"\n"
  migrate:
    volumes:
    - ./backend/alembic:/app/alembic:ro
  frontend:
    volumes:
    - ./frontend:/app
    - /app/node_modules
    environment:
    - NEXT_TELEMETRY_DISABLED=1
    # dev 模式的跨站资源保护白名单：取 shell 环境变量或仓库根目录 .env（Compose 不读 .env.local）；缺省仅 localhost
    - ALLOWED_DEV_ORIGINS=${ALLOWED_DEV_ORIGINS:-localhost,127.0.0.1}
    command: ["pnpm", "dev"]
    build:
      context: ./frontend
      target: dev

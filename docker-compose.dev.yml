services:
  backend:
    volumes:
    - ./backend:/app/backend:ro
    environment:
    - UVICORN_RELOAD=true
    command: "bash -c \"\n  cd /app &&\n  uv run uvicorn app.main:app --reload --host\
      \ 0.0.0.0 --port 8000\n\"\n"
  frontend:
    volumes:
    - ./frontend:/app
    - /app/node_modules
    environment:
    - WATCHPACK_POLLING=true
    - CHOKIDAR_USEPOLLING=true
    - NEXT_TELEMETRY_DISABLED=1
    command: ["pnpm", "dev"]
    build:
      context: ./frontend
      target: dev

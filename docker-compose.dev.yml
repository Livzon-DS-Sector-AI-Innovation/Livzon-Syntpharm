version: '3.8'

services:
  backend:
    volumes:
      - ./backend:/app/backend:ro  # 只读挂载，避免权限问题
    environment:
      - UVICORN_RELOAD=true
    command: >
      bash -c "
        cd /app &&
        uv run uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
      "

  frontend:
    volumes:
      - ./frontend:/app/frontend:ro
    environment:
      - NEXT_TELEMETRY_DISABLED=1
    command: >
      bash -c "
        cd /app &&
        pnpm dev
      "

services:
  backend:
    volumes:
    - ./backend/app:/app/app:ro
    # 宿主机无 uv，测试只能在容器里跑；不挂 tests 就得每次 docker cp
    - ./backend/tests:/app/tests:ro
    environment:
    - UVICORN_RELOAD=true
    command: "bash -c \"\n  cd /app &&\n  uv run uvicorn app.main:app --reload --host\
      \ 0.0.0.0 --port 8000\n\"\n"
  frontend:
    volumes:
    - ./frontend:/app
    - /app/node_modules
    environment:
    - NEXT_TELEMETRY_DISABLED=1
    command: ["pnpm", "dev"]
    build:
      context: ./frontend
      target: dev

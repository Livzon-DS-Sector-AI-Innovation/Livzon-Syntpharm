services:
  postgres-e2e:
    image: postgres:17
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dazah_e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dazah_e2e"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend-e2e:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "13000:13000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - frontend_e2e_next:/app/.next
    environment:
      NODE_ENV: development
      API_BASE_URL: http://host.docker.internal:18000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "npx next dev -H 0.0.0.0 -p 13000"

volumes:
  frontend_e2e_next:

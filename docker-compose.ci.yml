services:
  ci-build:
    # The image is produced by the `frontend-build` CI job and loaded by the
    # `e2e` job (docker load). Naming it here is what makes `docker compose run
    # ci-build` reuse that image instead of rebuilding it (~3 min) — compose
    # only builds when the named image is missing locally.
    # `build:` is kept on purpose: on a machine without the prebuilt image,
    # compose falls back to building exactly like before.
    image: frontend-production:latest
    build:
      context: ./frontend
      target: runtime
    environment:
      NODE_ENV: production
  postgres:
    image: postgres:17
    ports:
    - 15432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dazah_e2e
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d dazah_e2e
      interval: 1s
      timeout: 5s
      retries: 30
  backend-e2e:
    # Same pattern as ci-build: the `backend-image` CI job builds and saves this
    # image, the `e2e` job loads it. When it is absent (local run, or the
    # artifact is unavailable), `build:` produces it in place — the old
    # behaviour — so this is a pure speed-up, never a new failure mode.
    image: dazah-backend:latest
    build: ./backend
    volumes:
    - ./backend/app:/app/app
    - ./backend/alembic:/app/alembic
    - ./backend/alembic.ini:/app/alembic.ini
    ports:
    - 18000:8000
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/dazah_e2e
      FEISHU__PLATFORM__APP_ID: ci_dummy
      FEISHU__PLATFORM__APP_SECRET: ci_dummy
      FRONTEND_URL: http://127.0.0.1:13000
      APP_ENV: e2e
      E2E_AUTH_SECRET: e2e-test-secret
    command: 'sh -c "uv run --no-dev alembic upgrade head && uv run --no-dev uvicorn
      app.main:app --host 0.0.0.0 --port 8000 --workers 1"

      '
    healthcheck:
      test:
      - CMD
      - uv
      - run
      - --no-dev
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready',
        timeout=2)
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

services:
  ci-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: production

  postgres:
    image: postgres:17
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dazah_e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dazah_e2e"]
      interval: 1s
      timeout: 5s
      retries: 30
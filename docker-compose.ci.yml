services:
  ci-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: production

  postgres:
    image: postgres:17
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dazah_e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dazah_e2e"]
      interval: 1s
      timeout: 5s
      retries: 30

  backend-e2e:
    build: ./backend
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    ports:
      - "18000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/dazah_e2e
      FEISHU__PLATFORM__APP_ID: ci_dummy
      FEISHU__PLATFORM__APP_SECRET: ci_dummy
      FEISHU__PLATFORM__REDIRECT_URI: http://127.0.0.1:13000/auth/callback
      FRONTEND_URL: http://127.0.0.1:13000
      APP_ENV: e2e
      E2E_AUTH_SECRET: e2e-test-secret
    command: >
      sh -c "uv run alembic upgrade head &&
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

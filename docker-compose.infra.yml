# 测试服务器 - 基础设施层
# 运行: docker compose --env-file .env.test -f docker-compose.infra.yml up -d
# 用途: 提供共享的数据库、缓存、对象存储服务

services:
  postgres:
    image: postgres:17
    container_name: test-postgres
    restart: unless-stopped
    env_file:
      - .env.test
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp_test}
      POSTGRES_USER: ${POSTGRES_USER:-erp_test_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp_test_user} -d ${POSTGRES_DB:-erp_test}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test-net

  redis:
    image: redis:8-alpine
    container_name: test-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis_test_pwd}"]
    volumes:
      - ./redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_test_pwd}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test-net

  minio:
    image: minio/minio:latest
    container_name: test-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - ./minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test-net

networks:
  test-net:
    driver: bridge
